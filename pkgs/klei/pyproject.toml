[project]
name = "klei"
version = "0.0.0"
description = "Klei data clients for lst-bot."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "selectolax>=0.4.11",
    "urllib3-future>=2.24.905",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
