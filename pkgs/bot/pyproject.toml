[project]
name = "bot"
version = "0.0.0"
description = "Base bot framework package for lst-bot."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.2.2",
    "diwire>=1.4.2",
    "pydantic>=2.13.4",
    "robyn>=0.84.0",
    "urllib3-future>=2.21.902",
    "websockets>=16.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
