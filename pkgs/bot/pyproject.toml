[project]
name = "bot"
version = "0.0.0"
description = "Base bot framework package for lst-bot."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.2.4",
    "diwire>=1.4.4",
    "pydantic>=2.13.5",
    "robyn>=0.88.0",
    "urllib3-future>=2.24.905",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
