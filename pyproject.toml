[project]
name = "lst-bot"
version = "0.0.0"
description = "The LST community bot application."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "bot",
    "fastmcp-slim[client]>=4.0.3",
    "hitokoto",
    "httpx2[http2]>=2.12.0",
    "jsonschema>=4.26.0",
    "klei",
    "lst",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openrouter]>=2.40.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
lst-bot = "lst_bot.main:main"

[dependency-groups]
dev = [
    "prek>=0.5.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[build-system]
requires = ['uv_build>=0.12.10,<0.13']
build-backend = 'uv_build'

[tool.uv]
required-version = '>=0.12.10,<0.13'

[tool.uv.workspace]
members = [
    "pkgs/*",
]

[tool.uv.sources]
bot = { workspace = true }
hitokoto = { workspace = true }
klei = { workspace = true }
lst = { workspace = true }

[tool.ruff]
preview = true
required-version = '>=0.16.6'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'missing-trailing-comma',  # Conflicts with `ruff format`.
    'TC',      # Runtime use of typing constructs is common now.
    'CPY',     # Covered by the standalone LICENSE file.
    'too-many-arguments', # Explicit is better than implicit.
    'no-self-use', # Violates the usual practice.
    'any-type',  # Framework boundaries carry protocol and DI values.
    'blind-except',  # Dispatch records handler exceptions before re-raising.
    'D',       # Too verbose.
    'FBT',     # Too strict.
    'too-many-return-statements', # Small resolver functions are branchy by nature.
]
allowed-confusables = ['，', '：', '；', '？', '（', '）']

[tool.ruff.lint.per-file-ignores]
'**/tests/**/*.py' = [
    'assert',    # Assert statements used for pytest.
    'implicit-namespace-package',  # Colocated tests are plain directories, not import packages.
    'magic-value-comparison', # Magic value used in test cases.
    'compare-to-empty-string', # be more precise about assertion in tests.
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ty.environment]
extra-paths = ['pkgs/bot/tests']
python-platform = "linux"

[tool.pytest]
minversion = '9.1.1'
testpaths = ['tests', 'pkgs']
pythonpath = ['pkgs/bot/tests']
strict = true
filterwarnings = ['error']
asyncio_mode = 'auto'
asyncio_debug = true
